# 仿真专用参数（sim 分支使用，覆盖 params.yaml 中的 fusion_manager 部分）
fusion_manager:
  ros__parameters:
    calib_yaml:         "config/sim_calib.yaml"
    confirm_thresh:     2        # 仿真帧率稳定，2 帧即确认目标
    max_miss_frames:    10       # 允许更多漏帧
    match_dist_thresh:  300.0    # 像素距离阈值放宽（仿真 bbox 为近似值）
    match_iou_thresh:   0.01     # IoU 阈值放宽
    # 三机编队相邻间距 ~10.6m，关联阈值要小于这个值，否则贪心匹配会把
    # 邻机绑到同一个 track 上。设 5m 给 KF 预测漂移留点裕量。
    track_assoc_dist:   5.0
    warn_confidence:    0.70
    warn_level:         "HIGH"
    # 云台：开启动态外参（gimbal_controller 发布 TF lidar→camera_optical）
    # TF 不可用时（启动初期或云台节点未运行）会自动回退到 calib_yaml 静态外参
    use_tf_extrinsic:   true
    tf_camera_frame:    "camera_optical"
    tf_lidar_frame:     "lidar"

# 云台控制器（v1.1：雷达+相机同转 + 目标锁定）
# 订阅 /radar/detect → 转世界坐标 → 在已锁定目标附近用空间最近邻找回它
# → 锁定丢失 lock_loss_timeout 秒才允许重选 → 限速 PD 追踪
# → 写 sensor_head 模型姿态（雷达+相机一起转）+ 发布动态 TF map→lidar
gimbal_controller:
  ros__parameters:
    # 云台旋转中心（世界坐标，米）。也是雷达 frame 原点。
    pivot_x:    0.0
    pivot_y:    0.0
    pivot_z:    1.55
    # 关节角度限制
    pan_min_deg:        -180.0
    pan_max_deg:         180.0    # ±180°：360° 全向（实际机械限位）
    tilt_min_deg:        -85.0    # 向上看为负 pitch，最多上仰 85°
    tilt_max_deg:         30.0
    # 速率限制（FLIR PTU-D46 典型规格）
    pan_speed_deg_per_sec:   60.0
    tilt_speed_deg_per_sec:  45.0
    # 目标筛选
    min_target_distance: 5.0      # 距离 < 5m 的检测忽略（近距离意义不大）
    # 目标锁定参数（防抖核心）
    lock_radius_m:       6.0      # 锁定目标在两帧间最大允许位移（米）
    lock_loss_timeout:   2.0      # 锁定目标连续丢失 N 秒才允许换目标
    # 控制频率
    control_rate_hz:     30.0
    # Gazebo 模型实体名
    entity_name:         "sensor_head"
    # TF frame 名
    tf_world_frame:      "map"
    tf_lidar_frame:      "lidar"
    tf_camera_frame:     "camera_optical"
    # 相机相对雷达的 z 偏移（sensor_head 内部装配，米）
    camera_offset_z:     0.07

# YOLO 视觉检测（simulation 包的 yolo_node，桥接 conda 环境的 ultralytics）
yolo_detector:
  ros__parameters:
    model_path:   "model/ONNX/yolo_drone.onnx"   # 也可改为 .pt（worker 自动匹配）
    conf_thresh:  0.25
    input_size:   640

# 雷达点云聚类（radar 包）
radar_processor:
  ros__parameters:
    map_pcd_path:        "/dev/null"   # 故意失效，跳过 GICP 背景去除（仿真无背景地图）
    voxel_size:          0.05    # 降采样粒度更细，保留无人机外形细节
    cluster_tolerance:   1.5
    cluster_min_size:    3             # 仿真点云稀疏，降低阈值
    cluster_max_size:    500
    # 雷达现在静止、与世界坐标轴对齐，z 即世界垂直高度（相对雷达 1.55m）。
    # 仿真无地面杂波，高度阈值仍放宽，避免边缘情况误删稀疏目标。
    drone_min_height:   -50.0
    drone_max_height:    50.0
    drone_max_size:      6.0           # 放大后无人机直径 ~2m，留 3 倍裕量
    roi_x_min:          -100.0
    roi_x_max:           100.0
    roi_y_min:          -100.0
    roi_y_max:           100.0
    roi_z_min:          -50.0
    roi_z_max:           50.0
    # 离群点滤除：仿真点云稀疏，无人机只有 ~10 个点，原默认 mean_k=30 会把无人机全部误删
    outlier_mean_k:      5
    outlier_stddev_mul:  2.0

web_dashboard_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 5000
    origin_lat: 39.9000
    origin_lng: 116.4000
