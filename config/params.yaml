# ═══════════════════════════════════════════════════════════════════════════════
# drone-radar-fusion / config/params.yaml
# 统一参数配置文件，所有节点共用
# ═══════════════════════════════════════════════════════════════════════════════

# ── 雷达处理节点（radar_processor）────────────────────────────────────────────
# 实物近距离调参（无人机在 20m 内飞行）：放宽过滤让稀疏点云的小目标也能保留
radar_processor:
  ros__parameters:
    # 地图点云路径（相对于项目根目录）
    # 设一个不存在的路径，让 pcl::loadPCDFile 干净返回 -1（GICP 自动跳过）。
    # ⚠️ 不要用 /dev/null —— PCL 解析 0 字节文件会 segfault 直接挂掉 radar_node
    # 等你有时间扫一段 30s 环境背景，导出 .pcd 后改回 "config/drone_map.pcd"
    map_pcd_path: "config/_no_background.pcd"

    # 体素滤波分辨率（米）
    # 5cm：保留无人机的 30+ 个点（15cm 会把无人机降到 1-2 个点）
    voxel_size: 0.05

    # 感兴趣区域（ROI），单位：米，相对雷达坐标系
    # 你飞 20m 内，ROI 取 ±30m 留 10m 余量；多余范围只增加杂波
    roi_x_min: -30.0
    roi_x_max:  30.0
    roi_y_min: -30.0
    roi_y_max:  30.0
    roi_z_min:   1.5    # 高于 1.5m 才认为是飞行物（避开地面、人）
    roi_z_max:  50.0    # 上限给足，你飞不到 50m

    # 欧几里得聚类（v2：更激进，追求高检出率）
    cluster_tolerance: 2.5    # 2.5m 内的点算同一物体（远距稀疏点也能成团）
    cluster_min_size:  2      # 远距离 / 边缘情况只有 2-3 点也接受
    cluster_max_size:  500

    # 无人机候选过滤（高度和尺寸范围）
    drone_min_height: 1.5     # 与 roi_z_min 一致
    drone_max_height: 50.0
    drone_max_size:   10.0    # 你飞到 30m 时点云会"分裂"成多团，放宽尺寸允许大 cluster

    # GICP 地图配准
    gicp_max_iter:   50
    gicp_fitness_eps: 0.01

    # 离群点滤除（核心 — "雷达看不到无人机" 90% 是这里太严）
    # mean_k=3：极度宽松，几乎不过滤（牺牲一点噪声换检出率）
    outlier_mean_k:     3
    outlier_stddev_mul: 2.5

# ── YOLO 检测节点（camera_yolo 包，通过 conda subprocess 跑 ultralytics）─────
# 不再使用旧的 camera_vision (C++)，因为系统 OpenCV 4.5.4 解析 YOLOv8 ONNX 崩溃。
# 现走 Python 节点：rclpy 收图 → JPEG 编码 → stdin 管道 → conda 里 ultralytics
# 推理 → JSON stdout 返回。
yolo_detector:
  ros__parameters:
    # 模型路径（worker 内部会优先尝试同名 .pt，找不到再回退到 .onnx）
    model_path:   "model/ONNX/yolo_drone.onnx"
    conf_thresh:  0.60         # 置信度阈值（0~1）：值越大越严，假阳性越少。
                               # 0.25 太宽容会把人当 drone；0.60 起步，看效果再微调
    input_size:   640
    image_topic:  "/hik_camera/image_raw"

    # conda 环境的 Python 解释器路径。如果你的 conda env 不在默认位置，改这里。
    # 创建：conda create -n yolov8 python=3.10 && conda activate yolov8 && \
    #       pip install ultralytics opencv-python
    conda_python: "/home/guichen/miniconda3/envs/yolov8/bin/python"

# ── 海康相机驱动 ─────────────────────────────────────────────────────────────
# 参数已迁移到 src/hik_camera/config/camera_params.yaml，由 hik_camera_ros2_driver
# 自己加载（node 名 = /hik_camera_ros2_driver）。这里不再重复，避免参数名漂移。

# ── 融合节点（fusion_manager）─────────────────────────────────────────────────
fusion_manager:
  ros__parameters:
    # 相机-雷达标定外参文件路径
    # ★ 待填入：使用 camera_calib 工具或 Kalibr 标定后生成
    calib_yaml: "config/out_matrix.yaml"

    confirm_thresh:    3      # 目标确认所需连续命中帧数
    max_miss_frames:   5      # 目标消失帧数上限
    match_dist_thresh: 60.0   # 相机-雷达投影匹配距离阈值（像素）
    match_iou_thresh:  0.25
    track_assoc_dist:  8.0    # 米：track 关联阈值（>此距离视为新目标）
    warn_confidence:   0.70   # 触发报警的最低置信度
    warn_level:        "HIGH" # "LOW" / "MEDIUM" / "HIGH"
    # ⚠️ 没接相机时设 true：跳过相机时间同步，雷达检测直接进入追踪
    #    → /fusion/final_result / 前端地图能看到目标
    # 接上相机后改回 false，恢复 雷达+相机 全融合
    radar_only_mode:   true

# ── Web Dashboard（web_dashboard_node）────────────────────────────────────────
web_dashboard_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 5000
    # ★ 修改为你的监控区域地理坐标（地图光标位置基准）
    origin_lat: 39.9000      # 监控区域原点纬度
    origin_lng: 116.4000     # 监控区域原点经度

# ── 看门狗（watchdog_node）────────────────────────────────────────────────────
watchdog_node:
  ros__parameters:
    heartbeat_timeout: 10.0  # 秒
