# ═══════════════════════════════════════════════════════════════════════════════
# drone-radar-fusion / config/params.yaml
# 统一参数配置文件，所有节点共用
# ═══════════════════════════════════════════════════════════════════════════════

# ── 雷达处理节点（radar_processor）────────────────────────────────────────────
radar_processor:
  ros__parameters:
    # 地图点云路径（相对于项目根目录）
    # ★ 待填入：用 Livox Avia 扫描监控区域后保存的 .pcd 文件
    map_pcd_path: "config/drone_map.pcd"

    # 体素滤波分辨率（米）
    voxel_size: 0.15

    # 感兴趣区域（ROI），单位：米，相对雷达坐标系
    roi_x_min: -150.0
    roi_x_max:  150.0
    roi_y_min: -150.0
    roi_y_max:  150.0
    roi_z_min:    3.0    # 低于 3m 的点视为地面/建筑，过滤掉
    roi_z_max:  200.0

    # 欧几里得聚类
    cluster_tolerance: 2.0    # 聚类半径（米）
    cluster_min_size:  4      # 最少点数
    cluster_max_size:  300

    # 无人机候选过滤（高度和尺寸范围）
    drone_min_height: 5.0     # 米，低于此高度不认为是无人机
    drone_max_height: 200.0
    drone_max_size:   8.0     # 聚类包围盒最大边长（米）

    # GICP 地图配准
    gicp_max_iter:   50
    gicp_fitness_eps: 0.01

# ── YOLO 检测节点（yolo_detector）─────────────────────────────────────────────
yolo_detector:
  ros__parameters:
    # ★ 待填入：训练好的无人机 YOLO ONNX 模型路径
    # 推荐数据集：VisDrone（https://github.com/VisDrone/VisDrone-Dataset）
    # 或自采集数据集 + YOLOv8n 训练，导出为 ONNX：yolo export model=best.pt format=onnx
    model_path:       "model/ONNX/yolo_drone.onnx"
    class_names_path: "model/ONNX/classes.txt"

    input_width:  640
    input_height: 640
    conf_thresh:  0.50        # 置信度阈值（可根据场景调整）
    nms_thresh:   0.45
    use_gpu:      true        # false = 仅 CPU 推理

# ── 海康相机驱动节点（hik_camera）─────────────────────────────────────────────
# ★ 待填入：海康驱动安装后参考其 README 配置
# 驱动推荐：https://github.com/whlook/ros_hik_camera  或官方 MVS SDK ROS2 封装
hik_camera:
  ros__parameters:
    camera_sn: ""             # 相机序列号（留空则自动选第一个）
    width:  1920
    height: 1080
    fps:    30
    exposure_time: 5000       # 微秒
    gain:    0.0

# ── 融合节点（fusion_manager）─────────────────────────────────────────────────
fusion_manager:
  ros__parameters:
    # 相机-雷达标定外参文件路径
    # ★ 待填入：使用 camera_calib 工具或 Kalibr 标定后生成
    calib_yaml: "config/out_matrix.yaml"

    confirm_thresh:    3      # 目标确认所需连续命中帧数
    max_miss_frames:   5      # 目标消失帧数上限
    match_dist_thresh: 60.0   # 相机-雷达投影匹配距离阈值（像素）
    match_iou_thresh:  0.25
    warn_confidence:   0.70   # 触发报警的最低置信度
    warn_level:        "HIGH" # "LOW" / "MEDIUM" / "HIGH"

# ── Web Dashboard（web_dashboard_node）────────────────────────────────────────
web_dashboard_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 5000
    # ★ 修改为你的监控区域地理坐标（地图光标位置基准）
    origin_lat: 39.9000      # 监控区域原点纬度
    origin_lng: 116.4000     # 监控区域原点经度

# ── 看门狗（watchdog_node）────────────────────────────────────────────────────
watchdog_node:
  ros__parameters:
    heartbeat_timeout: 10.0  # 秒
