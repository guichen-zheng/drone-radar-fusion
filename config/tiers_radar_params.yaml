# TIERS TelloOut02 专用雷达参数。
# 与 config/params.yaml 叠加使用，不影响实物默认配置。

radar_processor:
  ros__parameters:
    # 至少10个不同帧重复观测到的体素：比20帧地图更完整，又不像5帧地图那样
    # 容易把缓慢移动的无人机轨迹吸收到背景中。
    map_pcd_path: "/media/guichen/T7/ros_bag/TelloOut02_background_balanced.pcd"

    # 背景PCD与bag点云都在固定的 livox_frame，无需逐帧GICP。
    background_align_gicp: false
    # 距离背景表面超过30cm才算前景。墙前无人机应保留，墙面扫描抖动被滤除。
    background_distance_thresh: 0.30
    gicp_max_corr_dist: 1.0

    # 背景生成使用10cm体素；运行时也采用10cm，减少墙面扫描噪声。
    voxel_size: 0.10

    # z 是相对 Avia 安装中心的坐标，不是相对地面的飞行高度。
    # TelloOut02 的完整目标轨迹 z 约为 -0.37--1.26m；地面杂点主要在
    # z≈-1m。残余远墙固定在 (x≈42m, y≈22m)，由 x/y ROI 排除。
    roi_x_min:   2.0
    roi_x_max:  30.0
    roi_y_min: -10.0
    roi_y_max:  10.0
    roi_z_min:  -0.5
    roi_z_max:   3.0

    # 背景差分后只聚类紧凑小物体，不再允许2.5m间隔把墙面连接起来。
    cluster_tolerance: 0.45
    cluster_min_size:  2
    cluster_max_size:  120
    drone_min_height: -0.5
    drone_max_height:  3.0
    drone_max_size:    1.5

    # Avia远距离无人机可能只有少量点，禁用SOR以免把目标本身删除。
    outlier_mean_k: 0
    outlier_stddev_mul: 2.5

fusion_manager:
  ros__parameters:
    # Avia对小型Tello不是每帧都有回波，100Hz下允许短暂丢失0.3秒。
    confirm_thresh: 3
    max_miss_frames: 30
    # 相邻候选必须在1m内才属于同一轨迹，防止远处杂波串成目标。
    track_assoc_dist: 1.0
