/hik_camera_ros2_driver:
  ros__parameters:
    camera_info_url: "package://hik_camera_ros2_driver/config/camera_info.yaml"
    pixel_format: "BayerRG8"        # Recommended Option: "RGB8Packed", "BayerRG8"
    adc_bit_depth: "Bits_8"         # If using "BayerRG8", <adc_bit_depth> must be set as "Bits_8"; otherwise, it can be "Bits_8" or "Bits_12"
    use_sensor_data_qos: false
    # ── 命名（让发布 topic 落到 /hik_camera/image_raw，与 yolo_detector 订阅、RViz 配置对齐）──
    camera_name: "hik_camera"
    camera_topic: "hik_camera/image_raw"
    # frame_id: "optical_frame"     # If not set, it will be set as <camera_name>_optical_frame

    # ── 拍摄参数（现场可调）──
    acquisition_frame_rate: 30.0    # Hz：30 帧对融合管线足够；过高会徒增 CPU
    # 强光户外（拍天空里的无人机）：增益拉到最低，靠曝光时间控制亮度
    #   天空过曝成白片 → 先把 gain 降到 0，再视情况调小 exposure_time
    #   阴天/傍晚变暗 → 先加大 exposure_time（上限 ~33000μs），不够再加 gain
    exposure_time: 100              # μs：中午直射可压到 50~100；普通强光 200~500；屋里暗 5000~25000
    gain: 0.0                       # dB（0~16.9）：强光设 0；只有曝光到上限仍暗才加
