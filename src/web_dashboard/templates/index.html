<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无人机监控系统</title>

<!-- Leaflet 地图 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Arial', sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }

  /* ── 顶部状态栏 ── */
  #topbar {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 8px 20px; display: flex; align-items: center; gap: 20px;
  }
  #topbar h1 { font-size: 16px; color: #58a6ff; letter-spacing: 1px; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #3fb950; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #drone-count { font-size: 13px; color: #8b949e; }
  #drone-count span { color: #f0883e; font-weight: bold; font-size: 15px; }

  /* ── 主体布局 ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── 地图 ── */
  #map { flex: 1; }

  /* ── 右侧面板 ── */
  #panel {
    width: 320px; background: #161b22; border-left: 1px solid #30363d;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-section { border-bottom: 1px solid #30363d; padding: 12px 14px; }
  .panel-title { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

  /* 目标列表 */
  #drone-list { overflow-y: auto; flex: 1; }
  .drone-card {
    margin: 8px; padding: 10px 12px;
    background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    cursor: pointer; transition: border-color .2s;
  }
  .drone-card:hover { border-color: #58a6ff; }
  .drone-card.warn { border-color: #f85149; background: #2d1b1b; }
  .drone-card .drone-id { font-size: 13px; font-weight: bold; color: #58a6ff; }
  .drone-card .drone-coords { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .drone-card .drone-height { font-size: 18px; font-weight: bold; color: #3fb950; }
  .drone-card .drone-conf { font-size: 11px; color: #f0883e; }
  .drone-card .drone-speed { font-size: 11px; color: #a5d6ff; }

  /* 相机预览 */
  #camera-preview {
    width: 100%; aspect-ratio: 16/9;
    background: #000; display: flex; align-items: center; justify-content: center;
    color: #30363d; font-size: 12px;
  }
  #camera-preview img { width: 100%; height: 100%; object-fit: contain; }

  /* ── 报警弹窗 ── */
  #warn-overlay {
    position: fixed; top: 60px; right: 340px;
    display: flex; flex-direction: column; gap: 8px; z-index: 9999;
    pointer-events: none;
  }
  .warn-toast {
    background: #2d1b1b; border: 1px solid #f85149; border-left: 4px solid #f85149;
    border-radius: 6px; padding: 10px 14px; min-width: 260px;
    pointer-events: all; animation: slideIn .3s ease;
  }
  @keyframes slideIn { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }
  .warn-toast .warn-title { color: #f85149; font-size: 13px; font-weight: bold; }
  .warn-toast .warn-body  { color: #e6edf3; font-size: 12px; margin-top: 4px; }
  .warn-toast .warn-close {
    float: right; cursor: pointer; color: #8b949e;
    background: none; border: none; font-size: 14px;
  }

  /* ── 高度色标 ── */
  #legend {
    position: absolute; bottom: 30px; left: 10px; z-index: 1000;
    background: rgba(22,27,34,.85); border: 1px solid #30363d;
    padding: 8px 12px; border-radius: 6px; font-size: 11px;
  }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ── 传感器位姿工具 ── */
  #pose-btn {
    padding: 5px 12px;
    background: #21262d; border: 1px solid #30363d; border-radius: 4px;
    color: #8b949e; cursor: pointer; font-size: 12px; transition: all .2s;
    white-space: nowrap;
  }
  #pose-btn:hover { border-color: #58a6ff; color: #e6edf3; }
  #pose-btn.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
  #pose-info { font-size: 12px; color: #8b949e; white-space: nowrap; }
  #pose-info span.val { color: #f0883e; font-weight: bold; }
  #map.pose-mode { cursor: crosshair !important; }
  #map.pose-mode .leaflet-interactive { cursor: crosshair !important; }
  /* SVG 拖拽箭头层（覆盖在地图之上） */
  #drag-arrow-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 500;
  }
  /* 操作提示浮层 */
  #pose-hint {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(22,27,34,.92); border: 1px solid #58a6ff; border-radius: 6px;
    padding: 8px 16px; font-size: 12px; color: #e6edf3;
    z-index: 1001; pointer-events: none; display: none; white-space: nowrap;
  }
  /* ── 地点搜索框 ── */
  #search-box { display: flex; gap: 4px; align-items: center; }
  #search-input {
    background: #21262d; border: 1px solid #30363d; border-radius: 4px;
    color: #e6edf3; padding: 5px 10px; font-size: 12px; width: 180px; outline: none;
  }
  #search-input:focus { border-color: #58a6ff; }
  #search-input::placeholder { color: #484f58; }
  #search-btn {
    padding: 5px 10px; background: #21262d; border: 1px solid #30363d;
    border-radius: 4px; color: #8b949e; cursor: pointer; font-size: 12px;
  }
  #search-btn:hover { border-color: #58a6ff; color: #e6edf3; }
  /* ── 传感器连接状态 ── */
  .sensor-status { font-size: 12px; white-space: nowrap; color: #f85149; }
  .sensor-status.ok { color: #3fb950; }
</style>
</head>
<body>

<!-- 顶部状态栏 -->
<div id="topbar">
  <div id="status-dot"></div>
  <h1>🛡 无人机监控系统</h1>
  <div id="drone-count">当前追踪目标：<span id="count">0</span></div>
  <button id="pose-btn" onclick="togglePoseMode()">📍 设置传感器位姿</button>
  <div id="pose-info" style="display:none">
    位置: <span class="val" id="pose-lat">--</span>, <span class="val" id="pose-lng">--</span>
    &nbsp;|&nbsp; 朝向: <span class="val" id="pose-heading">--</span>°
    (<span class="val" id="pose-dir">--</span>)
  </div>
  <div id="search-box" style="margin-left:auto">
    <input id="search-input" type="text" placeholder="🔍 搜索地点..."
           onkeydown="if(event.key==='Enter')searchLocation()">
    <button id="search-btn" onclick="searchLocation()">搜索</button>
  </div>
  <div id="radar-status" class="sensor-status">● 雷达</div>
  <div id="camera-status" class="sensor-status">● 相机</div>
</div>

<!-- 主体 -->
<div id="main">
  <div id="map" style="position:relative">
    <!-- 拖拽箭头 SVG 层 -->
    <svg id="drag-arrow-svg"></svg>
    <!-- 位姿设置操作提示 -->
    <div id="pose-hint">按住鼠标拖拽以设置传感器朝向，松开确认</div>
  </div>

  <div id="panel">
    <!-- 相机实时画面 -->
    <div class="panel-section">
      <div class="panel-title">📷 实时画面</div>
      <div id="camera-preview"><span>等待相机画面...</span></div>
    </div>
    <!-- 目标列表 -->
    <div class="panel-title" style="padding:10px 14px 0">🎯 检测目标</div>
    <div id="drone-list"></div>
  </div>
</div>

<!-- 报警弹窗容器 -->
<div id="warn-overlay"></div>

<!-- 高度图例 -->
<div id="legend">
  <div style="color:#8b949e;margin-bottom:4px">高度图例</div>
  <div class="legend-row"><div class="legend-dot" style="background:#3fb950"></div>0–50m</div>
  <div class="legend-row"><div class="legend-dot" style="background:#f0883e"></div>50–150m</div>
  <div class="legend-row"><div class="legend-dot" style="background:#f85149"></div>&gt;150m</div>
</div>

<script>
// ── 初始化地图（默认中心可在 params.yaml 配置，此处为示例坐标）──────────────
const map = L.map('map', { zoomControl: true }).setView([39.9, 116.4], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19
}).addTo(map);

// ── 高度 → 颜色映射 ───────────────────────────────────────────────────────
function heightColor(z) {
  if (z < 50)  return '#3fb950';
  if (z < 150) return '#f0883e';
  return '#f85149';
}

// ── 创建自定义无人机图标 ──────────────────────────────────────────────────
function droneIcon(z) {
  const color = heightColor(z);
  return L.divIcon({
    className: '',
    html: `<div style="
      width:28px;height:28px;border-radius:50%;
      background:${color};border:3px solid #fff;
      box-shadow:0 0 12px ${color};
      display:flex;align-items:center;justify-content:center;
      font-size:14px;">✈</div>`,
    iconSize: [28, 28], iconAnchor: [14, 14]
  });
}

// ── 存储地图 Marker 引用 ──────────────────────────────────────────────────
const droneMarkers = {};   // drone_id → L.marker
const droneCards   = {};   // drone_id → DOM element

// ── Socket.IO 连接 ────────────────────────────────────────────────────────
const socket = io();

socket.on('disconnect', () => setConnStatus(false));

function setConnStatus(ok) {
  if (!ok) {
    document.getElementById('radar-status').className  = 'sensor-status';
    document.getElementById('camera-status').className = 'sensor-status';
  }
}

socket.on('sensor_status', (data) => {
  document.getElementById('radar-status').className  = 'sensor-status' + (data.radar  ? ' ok' : '');
  document.getElementById('camera-status').className = 'sensor-status' + (data.camera ? ' ok' : '');
});

// ── 接收无人机坐标更新 ────────────────────────────────────────────────────
socket.on('drone_update', (data) => {
  const activIds = new Set();

  data.drones.forEach(d => {
    activIds.add(d.id);
    // 注意：此处 d.x, d.y 为雷达坐标系（米），需转换为经纬度
    // lat/lng 由 fusion 节点（CoordTransform）直接填入（WGS84 度），前端无需手动换算
    const lat = d.lat;
    const lng = d.lng;

    // 更新地图 Marker
    if (droneMarkers[d.id]) {
      droneMarkers[d.id].setLatLng([lat, lng]);
      droneMarkers[d.id].setIcon(droneIcon(d.z));
      droneMarkers[d.id].getPopup().setContent(popupHtml(d));
    } else {
      const marker = L.marker([lat, lng], { icon: droneIcon(d.z) })
        .bindPopup(popupHtml(d))
        .addTo(map);
      droneMarkers[d.id] = marker;
    }

    // 更新右侧面板卡片
    updateCard(d);
  });

  // 删除已消失的目标
  Object.keys(droneMarkers).forEach(id => {
    if (!activIds.has(parseInt(id))) {
      map.removeLayer(droneMarkers[id]);
      delete droneMarkers[id];
      document.getElementById(`card-${id}`)?.remove();
      delete droneCards[id];
    }
  });

  document.getElementById('count').textContent = activIds.size;
});

// ── 地图弹窗内容 ──────────────────────────────────────────────────────────
function popupHtml(d) {
  const spd = Math.sqrt(d.vx**2 + d.vy**2 + d.vz**2).toFixed(1);
  return `<div style="font-size:13px;line-height:1.7">
    <b>无人机 ID: ${d.id}</b><br>
    <span style="color:#555">坐标</span> X:${d.x}m  Y:${d.y}m<br>
    <span style="color:#555">高度</span> <b style="color:#16a34a">${d.z}m</b><br>
    <span style="color:#555">速度</span> ${spd} m/s<br>
    <span style="color:#555">置信度</span> ${(d.confidence*100).toFixed(0)}%
  </div>`;
}

// ── 右侧面板卡片更新 ──────────────────────────────────────────────────────
function updateCard(d) {
  const spd = Math.sqrt(d.vx**2 + d.vy**2 + d.vz**2).toFixed(1);
  let card = document.getElementById(`card-${d.id}`);
  if (!card) {
    card = document.createElement('div');
    card.id = `card-${d.id}`;
    card.className = 'drone-card';
    card.onclick = () => {
      if (droneMarkers[d.id]) {
        map.panTo(droneMarkers[d.id].getLatLng());
        droneMarkers[d.id].openPopup();
      }
    };
    document.getElementById('drone-list').appendChild(card);
  }
  card.innerHTML = `
    <div class="drone-id">✈ 目标 #${d.id}
      <span class="drone-conf" style="float:right">${(d.confidence*100).toFixed(0)}%</span>
    </div>
    <div class="drone-height" style="color:${heightColor(d.z)}">${d.z} m</div>
    <div class="drone-coords">X:${d.x}m  Y:${d.y}m</div>
    <div class="drone-speed">速度: ${spd} m/s &nbsp;|&nbsp; 类别: ${d.label}</div>
  `;
}

// ── 接收报警通知 ──────────────────────────────────────────────────────────
socket.on('drone_warn', (data) => {
  showWarnToast(data);
  // 对应卡片变红
  const card = document.getElementById(`card-${data.drone_id}`);
  if (card) card.classList.add('warn');
});

function showWarnToast(data) {
  const toast = document.createElement('div');
  toast.className = 'warn-toast';
  toast.innerHTML = `
    <button class="warn-close" onclick="this.parentElement.remove()">✕</button>
    <div class="warn-title">⚠ 无人机报警 [${data.level}]</div>
    <div class="warn-body">
      ID: ${data.drone_id} &nbsp;|&nbsp; 高度: ${data.z.toFixed(1)}m<br>
      坐标: (${data.x.toFixed(1)}, ${data.y.toFixed(1)})<br>
      置信度: ${(data.confidence*100).toFixed(0)}%
    </div>
  `;
  document.getElementById('warn-overlay').appendChild(toast);
  // 8 秒后自动消失
  setTimeout(() => toast.remove(), 8000);
}

// ── 接收相机帧 ────────────────────────────────────────────────────────────
socket.on('camera_frame', (data) => {
  const preview = document.getElementById('camera-preview');
  let img = preview.querySelector('img');
  if (!img) {
    preview.innerHTML = '';
    img = document.createElement('img');
    preview.appendChild(img);
  }
  img.src = 'data:image/jpeg;base64,' + data.data;
});

// ── 地图初始中心由后端 params.yaml 的 origin_lat/lng 决定 ────────────────────
// （lat/lng 已由 fusion 节点直接填入每个目标的消息字段，前端无需换算）

// ════════════════════════════════════════════════════════════════════════════
// 传感器位姿交互工具（类 RViz 2D Pose Estimate）
// 箭头根部 = 传感器经纬度，箭头方向 = 雷达朝向（相对正北，顺时针0-360°）
// ════════════════════════════════════════════════════════════════════════════

let poseMode      = false;    // 是否处于位姿设置模式
let poseDragging  = false;    // 是否正在拖拽
let poseOrigin    = null;     // 按下时的 L.LatLng（箭头根部）
let sensorMarkerGroup = L.layerGroup().addTo(map);  // 固定箭头图层

// ── 模式开关 ──────────────────────────────────────────────────────────────
function togglePoseMode() {
  poseMode = !poseMode;
  const btn   = document.getElementById('pose-btn');
  const hint  = document.getElementById('pose-hint');
  const mapEl = document.getElementById('map');

  if (poseMode) {
    btn.classList.add('active');
    btn.textContent = '✕ 取消设置';
    mapEl.classList.add('pose-mode');
    hint.style.display = 'block';
    map.dragging.disable();
    map.doubleClickZoom.disable();
  } else {
    btn.classList.remove('active');
    btn.textContent = '📍 设置传感器位姿';
    mapEl.classList.remove('pose-mode');
    hint.style.display = 'none';
    map.dragging.enable();
    map.doubleClickZoom.enable();
    clearDragArrow();
    poseDragging = false;
    poseOrigin   = null;
  }
}

// ── 罗盘方位角计算（0°=正北，顺时针，0-360°）─────────────────────────────
function calcHeading(from, to) {
  const dLat = to.lat - from.lat;
  const dLng = (to.lng - from.lng) * Math.cos(from.lat * Math.PI / 180);
  return ((Math.atan2(dLng, dLat) * 180 / Math.PI) + 360) % 360;
}

// ── 罗盘方向文字 ─────────────────────────────────────────────────────────
function compassLabel(h) {
  const dirs = ['北','东北','东','东南','南','西南','西','西北'];
  return dirs[Math.round(h / 45) % 8];
}

// ── 拖拽箭头绘制（SVG 像素坐标，跟随鼠标实时更新）────────────────────────
function drawDragArrow(fromLatLng, toLatLng, heading) {
  const svg     = document.getElementById('drag-arrow-svg');
  const mapEl   = document.getElementById('map');
  const w = mapEl.clientWidth, h = mapEl.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const fp = map.latLngToContainerPoint(fromLatLng);
  const tp = map.latLngToContainerPoint(toLatLng);
  const dx = tp.x - fp.x, dy = tp.y - fp.y;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len < 5) { svg.innerHTML = ''; return; }

  const angle = Math.atan2(dy, dx);
  const hl    = Math.min(22, len * 0.35);          // 箭头头部长度
  const a1 = angle + Math.PI * 0.75;
  const a2 = angle - Math.PI * 0.75;
  // 杆的终点（不延伸到箭头尖）
  const sx = tp.x - hl * 0.55 * Math.cos(angle);
  const sy = tp.y - hl * 0.55 * Math.sin(angle);

  svg.innerHTML = `
    <line x1="${fp.x}" y1="${fp.y}" x2="${sx}" y2="${sy}"
          stroke="#58a6ff" stroke-width="7" stroke-opacity=".18" stroke-linecap="round"/>
    <line x1="${fp.x}" y1="${fp.y}" x2="${sx}" y2="${sy}"
          stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4"/>
    <polygon points="${tp.x},${tp.y}
                     ${tp.x+hl*Math.cos(a1)},${tp.y+hl*Math.sin(a1)}
                     ${tp.x+hl*Math.cos(a2)},${tp.y+hl*Math.sin(a2)}"
             fill="#58a6ff" opacity=".9"/>
    <circle cx="${fp.x}" cy="${fp.y}" r="6" fill="#f0883e" stroke="#fff" stroke-width="2"/>
    <text x="${fp.x+10}" y="${fp.y-10}" fill="#f0883e" font-size="13"
          font-family="monospace" font-weight="bold"
          style="text-shadow:0 1px 3px #000">${heading.toFixed(1)}°</text>
  `;
}

function clearDragArrow() {
  document.getElementById('drag-arrow-svg').innerHTML = '';
}

// ── 确认位姿：绘制固定箭头 + 通知后端 ────────────────────────────────────
function renderSensorArrow(latlng, heading) {
  sensorMarkerGroup.clearLayers();

  // 根部橙色圆点
  L.circleMarker(latlng, {
    radius: 7, color: '#fff', weight: 2.5,
    fillColor: '#f0883e', fillOpacity: 1
  }).bindTooltip(
    `传感器位置<br>${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`,
    { direction: 'top' }
  ).addTo(sensorMarkerGroup);

  // 箭头杆（固定地理长度 60m）
  const R = 6378137;
  const theta = heading * Math.PI / 180;
  const dLat = (60 / R) * Math.cos(theta) * 180 / Math.PI;
  const dLng = (60 / R / Math.cos(latlng.lat * Math.PI / 180)) * Math.sin(theta) * 180 / Math.PI;
  const tip  = L.latLng(latlng.lat + dLat, latlng.lng + dLng);

  L.polyline([latlng, tip], { color: '#58a6ff', weight: 3, opacity: .9 })
   .addTo(sensorMarkerGroup);

  // 箭头头部（旋转 CSS 三角形）
  L.marker(tip, {
    icon: L.divIcon({
      className: '',
      html: `<div style="
        width:0;height:0;
        border-left:7px solid transparent;
        border-right:7px solid transparent;
        border-bottom:16px solid #58a6ff;
        transform:rotate(${heading}deg);
        transform-origin:center bottom;
        margin-top:-8px;margin-left:-7px;
        filter:drop-shadow(0 0 3px #58a6ff88);
      "></div>`,
      iconSize: [14, 16], iconAnchor: [7, 8]
    })
  }).addTo(sensorMarkerGroup);

  // 角度标签
  L.marker(tip, {
    icon: L.divIcon({
      className: '',
      html: `<div style="
        background:rgba(22,27,34,.88);border:1px solid #58a6ff;
        border-radius:3px;padding:2px 7px;font-size:11px;
        color:#58a6ff;white-space:nowrap;margin-left:12px;margin-top:-8px;
      ">${heading.toFixed(1)}° ${compassLabel(heading)}</div>`,
      iconAnchor: [0, 8]
    })
  }).addTo(sensorMarkerGroup);

  // 更新顶部信息栏
  document.getElementById('pose-lat').textContent     = latlng.lat.toFixed(6);
  document.getElementById('pose-lng').textContent     = latlng.lng.toFixed(6);
  document.getElementById('pose-heading').textContent = heading.toFixed(1);
  document.getElementById('pose-dir').textContent     = compassLabel(heading);
  document.getElementById('pose-info').style.display  = 'inline';
}

function confirmSensorPose(latlng, heading) {
  clearDragArrow();
  renderSensorArrow(latlng, heading);
  map.panTo(latlng);
  socket.emit('set_sensor_pose', { lat: latlng.lat, lng: latlng.lng, heading: heading });
}

// ── 地图鼠标事件绑定 ──────────────────────────────────────────────────────
map.on('mousedown', function(e) {
  if (!poseMode) return;
  poseDragging = true;
  poseOrigin   = e.latlng;
});

map.on('mousemove', function(e) {
  if (!poseMode || !poseDragging || !poseOrigin) return;
  const h = calcHeading(poseOrigin, e.latlng);
  drawDragArrow(poseOrigin, e.latlng, h);
  document.getElementById('pose-lat').textContent     = poseOrigin.lat.toFixed(6);
  document.getElementById('pose-lng').textContent     = poseOrigin.lng.toFixed(6);
  document.getElementById('pose-heading').textContent = h.toFixed(1);
  document.getElementById('pose-dir').textContent     = compassLabel(h);
  document.getElementById('pose-info').style.display  = 'inline';
});

map.on('mouseup', function(e) {
  if (!poseMode || !poseDragging || !poseOrigin) return;
  poseDragging = false;
  const dist = poseOrigin.distanceTo(e.latlng);
  if (dist < 5) { clearDragArrow(); poseOrigin = null; return; }
  const heading = calcHeading(poseOrigin, e.latlng);
  confirmSensorPose(poseOrigin, heading);
  togglePoseMode();   // 退出设置模式
});

// ── 连接后请求当前传感器位姿（刷新页面时恢复箭头）───────────────────────
socket.on('connect', () => {
  setConnStatus(true);
  socket.emit('request_sensor_pose');
  socket.emit('request_sensor_status');
});

socket.on('sensor_pose_current', (data) => {
  if (data && data.lat != null && data.lng != null && data.heading != null) {
    renderSensorArrow(L.latLng(data.lat, data.lng), data.heading);
  }
});

// ── 地点搜索（Nominatim / OpenStreetMap，无需 API Key）────────────────────
async function searchLocation() {
  const input = document.getElementById('search-input');
  const q = input.value.trim();
  if (!q) return;
  try {
    const res = await fetch(
      'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q) + '&format=json&limit=1',
      { headers: { 'Accept-Language': 'zh-CN,zh;q=0.9' } }
    );
    const data = await res.json();
    if (data.length > 0) {
      map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 14);
      input.style.borderColor = '#3fb950';
    } else {
      input.style.borderColor = '#f85149';
    }
  } catch (e) {
    input.style.borderColor = '#f85149';
  }
  setTimeout(() => { input.style.borderColor = ''; }, 1500);
}
</script>
